[project]
name = "netmon"
version = "0.1.0"
description = "Network Monitoring & Auto-Remediation System"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML",
    "bandit[toml]>=1.7",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --timeout=60"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]  # subprocess with fixed binary + shell=True-free; validated per-call

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and loose exception matchers.
"tests/**" = ["S101", "B017", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B104: the API deliberately binds 0.0.0.0 — a container serving the
#       Prometheus/API on internal docker networks.
# B310: urllib.urlopen against config-defined http:// targets; scheme is
#       hardcoded, host/path pydantic-validated. No user-controlled URLs.
skips = ["B104", "B310"]
