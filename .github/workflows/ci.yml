name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Linux runner: ICMP and RST-on-closed-port tests execute here.
      - run: pytest tests -q --cov=netmon --cov-report=term

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit[toml]
      - run: bandit -c pyproject.toml -r src

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build monitor image
        run: docker build -f infrastructure/docker/Dockerfile.monitor -t netmon-monitor:ci .
      - name: Build sim-node image
        run: docker build -f infrastructure/docker/Dockerfile.simnode -t netmon-simnode:ci infrastructure/docker
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: netmon-monitor:ci
          severity: CRITICAL,HIGH
          exit-code: "0"  # advisory while image deps are pinned; flip to 1 once baselined
